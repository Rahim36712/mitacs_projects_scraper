<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MITACS Scraper Cloud UI</title>
    <style>
      :root {
        --bg: #061021;
        --panel: #0f1d34;
        --line: rgba(148, 163, 184, 0.25);
        --text: #eef6ff;
        --muted: #95abc4;
        --primary: #67e8f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top, rgba(59,130,246,.2), transparent 32%), var(--bg);
        color: var(--text);
      }
      .shell { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
      .card {
        background: rgba(15, 29, 52, 0.85);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
      }
      h1, h2 { margin: 0 0 8px; }
      .muted { color: var(--muted); margin: 0; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .full { grid-column: 1 / -1; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input, select, button {
        width: 100%;
        background: rgba(5, 12, 24, 0.75);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .kw-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      button {
        cursor: pointer;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), #3b82f6);
        color: #02101f;
        border: none;
      }
      .downloads a {
        display: inline-block;
        margin: 6px 8px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
      }
      pre {
        background: rgba(5, 12, 24, 0.8);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        overflow: auto;
      }
      @media (max-width: 800px) {
        .grid, .kw-list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>MITACS Scraper Cloud UI</h1>
        <p class="muted">Use this Vercel UI with your Render/Railway scraper backend.</p>
      </div>

      <form id="scrapeForm" class="card">
        <div class="grid">
          <div class="full">
            <label for="backendUrl">Backend API URL</label>
            <input id="backendUrl" placeholder="https://your-backend.onrender.com" />
          </div>

          <div>
            <label for="keywordCount">How many keywords?</label>
            <input id="keywordCount" type="number" min="1" max="10" value="3" />
          </div>

          <div>
            <label for="maxPages">Max pages (0 = all)</label>
            <input id="maxPages" type="number" min="0" value="2" />
          </div>

          <div>
            <label for="format">Export format</label>
            <select id="format">
              <option value="csv">CSV</option>
              <option value="md">Markdown</option>
              <option value="both">CSV + Markdown</option>
            </select>
          </div>

          <div class="full">
            <h2>Keywords</h2>
            <div id="keywordList" class="kw-list"></div>
          </div>

          <div><label for="language">Language</label><input id="language" /></div>
          <div><label for="faculty_province">Faculty Province</label><input id="faculty_province" /></div>
          <div><label for="faculty_university">Faculty University</label><input id="faculty_university" /></div>
          <div><label for="faculty_campus">Faculty Campus</label><input id="faculty_campus" /></div>
          <div><label for="faculty_first_name">Faculty First Name</label><input id="faculty_first_name" /></div>
          <div><label for="faculty_last_name">Faculty Last Name</label><input id="faculty_last_name" /></div>
          <div class="full"><label for="academic_achievement">Academic Achievement</label><input id="academic_achievement" /></div>

          <div class="full">
            <button type="submit">Run Scraper</button>
          </div>
        </div>
      </form>

      <div class="card">
        <h2>Status</h2>
        <p id="status" class="muted">Idle</p>
        <div id="downloads" class="downloads"></div>
      </div>

      <div class="card">
        <h2>Response</h2>
        <pre id="output"></pre>
      </div>
    </div>

    <script>
      const keywordCount = document.getElementById("keywordCount");
      const keywordList = document.getElementById("keywordList");
      const backendInput = document.getElementById("backendUrl");
      const output = document.getElementById("output");
      const status = document.getElementById("status");
      const downloads = document.getElementById("downloads");
      const form = document.getElementById("scrapeForm");

      const savedBackend = localStorage.getItem("mitacs_backend_url") || "";
      backendInput.value = savedBackend;

      function renderKeywordInputs() {
        const count = Math.max(1, Math.min(10, Number(keywordCount.value || 1)));
        keywordCount.value = count;
        const existing = Array.from(keywordList.querySelectorAll("input"));
        keywordList.innerHTML = "";
        for (let i = 0; i < count; i += 1) {
          const input = document.createElement("input");
          input.placeholder = `Keyword ${i + 1}`;
          input.value = existing[i] ? existing[i].value : "";
          keywordList.appendChild(input);
        }
      }

      keywordCount.addEventListener("input", renderKeywordInputs);
      renderKeywordInputs();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        downloads.innerHTML = "";
        const backend = backendInput.value.trim().replace(/\/+$/, "");
        if (!backend) {
          status.textContent = "Please provide backend URL.";
          return;
        }
        localStorage.setItem("mitacs_backend_url", backend);

        const keywords = Array.from(keywordList.querySelectorAll("input"))
          .map((input) => input.value.trim())
          .filter(Boolean);
        if (!keywords.length) {
          status.textContent = "Please enter at least one keyword.";
          return;
        }

        const payload = {
          keywords,
          max_pages: Number(document.getElementById("maxPages").value || 0),
          export_format: document.getElementById("format").value,
          language: document.getElementById("language").value.trim(),
          faculty_province: document.getElementById("faculty_province").value.trim(),
          faculty_university: document.getElementById("faculty_university").value.trim(),
          faculty_campus: document.getElementById("faculty_campus").value.trim(),
          faculty_first_name: document.getElementById("faculty_first_name").value.trim(),
          faculty_last_name: document.getElementById("faculty_last_name").value.trim(),
          academic_achievement: document.getElementById("academic_achievement").value.trim()
        };

        status.textContent = "Scraping in progress...";
        output.textContent = "";

        try {
          const response = await fetch(`${backend}/api/scrape`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || `Request failed: ${response.status}`);
          }

          status.textContent = `Done: ${data.total_records} project(s) from ${data.total_keywords} keyword(s).`;
          output.textContent = JSON.stringify(data, null, 2);

          (data.files || []).forEach((file) => {
            const a = document.createElement("a");
            a.href = file.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = `Download ${file.name}`;
            downloads.appendChild(a);
          });
        } catch (error) {
          status.textContent = `Failed: ${error.message}`;
          output.textContent = error.stack || String(error);
        }
      });
    </script>
  </body>
</html>
